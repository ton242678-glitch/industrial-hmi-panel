name: Validate HMI archive
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/inspect_hmi.py
      - run: python tools/build_site.py
